<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - Manila Mail Manager</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/checkout.css">
</head>
<body>
  <div class="container">
    <h1>Manila Mail Manager</h1>
    <p class="subtitle">Pro Subscription</p>
    <div id="status">
      <div class="spinner"></div>
      <div class="status">Loading checkout...</div>
    </div>
  </div>

  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var txnId = params.get('txn');
      var token = params.get('token');
      var env = params.get('env') || 'sandbox';
      var returnUrl = params.get('return');
      var statusEl = document.getElementById('status');

      var RETRY_BUTTON = '<button class="retry-btn" onclick="location.reload()">Try Again</button>';

      function render(className, html, withRetry) {
        statusEl.innerHTML = '<div class="' + className + '">' + html + '</div>' +
          (withRetry ? RETRY_BUTTON : '');
      }

      function showError(msg, withRetry) {
        render('error', msg, withRetry);
      }

      if (!txnId || !token) {
        showError('Missing checkout parameters.', false);
        return;
      }

      try {
        if (env === 'sandbox') {
          Paddle.Environment.set('sandbox');
        }
        Paddle.Initialize({
          token: token,
          eventCallback: function(event) {
            if (event.name === 'checkout.completed') {
              render('status success', '&#10003; Payment successful!<br><br><span class="status-note">You can close this tab and return to the extension.<br>Your Pro features are now active.</span>', false);
            }
            if (event.name === 'checkout.closed') {
              render('status', 'Checkout closed.', true);
            }
          }
        });

        Paddle.Checkout.open({
          transactionId: txnId,
          settings: {
            displayMode: 'overlay',
            theme: 'light'
          }
        });
      } catch(e) {
        showError('Failed to load checkout: ' + e.message, true);
      }
    })();
  </script>
</body>
</html>
