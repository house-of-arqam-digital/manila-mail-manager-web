<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.paddle.com https://*.paddle.com; connect-src https://*.paddle.com; frame-src https://*.paddle.com; img-src 'self' data: https://*.paddle.com; style-src 'self' 'unsafe-inline'; font-src https://*.paddle.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Checkout - Manila Mail Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #666; margin-bottom: 24px; }
    .status { color: #888; font-size: 16px; padding: 20px 0; }
    .error { color: #ef4444; font-size: 14px; padding: 20px 0; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #eee;
      border-top-color: #764ba2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .retry-btn {
      background: #764ba2; color: white; border: none;
      padding: 12px 24px; border-radius: 8px; font-size: 14px;
      cursor: pointer; margin-top: 12px;
    }
    .retry-btn:hover { background: #653890; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Manila Mail Manager</h1>
    <p class="subtitle">Pro Subscription</p>
    <div id="status">
      <div class="spinner"></div>
      <div class="status">Loading checkout...</div>
    </div>
  </div>

  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
