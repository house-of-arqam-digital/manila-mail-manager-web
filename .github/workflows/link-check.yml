name: External link check

# External links rot on their own schedule, so this runs weekly rather than on
# every PR — a dead third-party link should not block a merge.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 'docs/**/*.html'
          fail: true
