version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for everything. Security updates need their own group
      # with applies-to, otherwise Dependabot opens them one advisory at a time.
      npm:
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # eslint and @eslint/js must move together, and html-validate majors
      # change which rules fire; both are manual upgrades, not weekly PRs.
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
